name: Weekly curation (manual)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Minimum successfully published prompts (50-100)'
        required: false
        default: '50'
        type: string

jobs:
  weekly:
    uses: ./.github/workflows/curate.yml
    with:
      limit: ${{ inputs.limit || 50 }}
    secrets: inherit
