name: Weekly curation

# 每周一北京时间 09:00（UTC 01:00）跑一次
# 也允许手动触发（Actions 页面 → Run workflow）
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of new prompts to add (max 100)'
        required: false
        default: '30'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prompt-curation
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download latest community README
        run: |
          mkdir -p /tmp/curate
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            -A "prompt-gallery-bot/1.0" \
            "https://raw.githubusercontent.com/Jermic/awesome-aiart-pics-prompts/master/README.md" \
            -o /tmp/curate/readme.md
          echo "Downloaded $(wc -c < /tmp/curate/readme.md) bytes"

      - name: Extract candidates
        run: |
          LOCAL_FILE=/tmp/curate/readme.md \
          MAX_CANDIDATES=1500 \
            node scripts/extract-prompts.mjs > /tmp/curate/candidates.json
          echo "Extracted $(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/curate/candidates.json','utf8')).candidates.length)") candidates"

      - name: Select fresh prompts
        env:
          CURATION_LIMIT: ${{ inputs.limit || '30' }}
        run: |
          LIMIT="$CURATION_LIMIT"
          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]] || [ "$LIMIT" -lt 1 ] || [ "$LIMIT" -gt 100 ]; then
            echo "limit must be an integer between 1 and 100"
            exit 1
          fi
          node scripts/select-fresh.cjs \
            --candidates /tmp/curate/candidates.json \
            --existing src/data/prompts.ts \
            --output /tmp/curate/selected.json \
            --limit "$LIMIT"
          echo "Selected $(node -e "console.log(require('/tmp/curate/selected.json').length)") prompts"

      - name: Upload and verify images in R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: aiartspell
          R2_PUBLIC_BASE_URL: https://media.aiartspell.art
          R2_CONCURRENCY: '4'
          R2_MAX_IMAGE_BYTES: '10485760'
        run: |
          node scripts/migrate-assets.mjs \
            --input /tmp/curate/selected.json \
            --output /tmp/curate/selected-r2.json \
            --manifest data/r2-assets.json \
            --report /tmp/curate/r2-report.json
          mv /tmp/curate/selected-r2.json /tmp/curate/selected.json

      - name: Generate TypeScript fragments
        run: |
          : > /tmp/curate/fragments.ts
          if [ ! -s /tmp/curate/selected.json ]; then
            echo "No verified new prompts to add; exiting early."
            exit 0
          fi
          node scripts/generate-fragments.cjs \
            --input /tmp/curate/selected.json \
            --output /tmp/curate/fragments.ts

      - name: Inject fragments into prompts.ts
        run: |
          if [ ! -s /tmp/curate/fragments.ts ]; then
            echo "No fragments to inject."
            exit 0
          fi
          node scripts/inject-fragments.cjs \
            --existing src/data/prompts.ts \
            --fragments /tmp/curate/fragments.ts \
            --output src/data/prompts.ts

      - name: Validate candidate assets
        run: |
          node scripts/validate-candidates.mjs \
            --input /tmp/curate/selected.json \
            --report /tmp/curate/candidate-validation.json

      - name: Build to verify
        run: npm run build

      - name: Validate generated assets
        run: |
          node scripts/validate-dist-assets.mjs --dist dist --allowed-legacy 25
          test -f dist/ads.txt

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet -- src/data/prompts.ts data/r2-assets.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new prompts to curate."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            NEW_COUNT=$(git diff --unified=0 -- src/data/prompts.ts | grep -c '^+    slug:' || true)
            echo "added=$NEW_COUNT" >> "$GITHUB_OUTPUT"
            echo "Curated $NEW_COUNT new prompts."
          fi

      - name: Generate PR body
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          node scripts/generate-pr-body.cjs \
            --selected /tmp/curate/selected.json \
            --added "${{ steps.check_changes.outputs.added }}" \
            --cadence weekly \
            --output /tmp/pr-body.md

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: curate ${{ steps.check_changes.outputs.added }} new prompts (weekly)'
          title: 'Weekly curation: ${{ steps.check_changes.outputs.added }} new prompts'
          body-path: /tmp/pr-body.md
          branch: curation/weekly-${{ github.run_id }}
          delete-branch: true
          add-paths: |
            src/data/prompts.ts
            data/r2-assets.json

      - name: Upload curation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curate-logs
          path: /tmp/curate/
          retention-days: 7
