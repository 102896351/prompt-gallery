name: Daily curation

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Minimum successfully published prompts (50-100)'
        required: false
        default: '50'
        type: string

jobs:
  daily:
    uses: ./.github/workflows/curate.yml
    with:
      limit: ${{ inputs.limit || 50 }}
    secrets: inherit
