name = "aiartspell-agnes-api"
main = "src/index.ts"
compatibility_date = "2026-08-28"

# Worker route is configured after verifying the zone and existing DNS setup.
# The public prompt-gallery R2 bucket is intentionally not bound here:
# anonymous uploads and generated images are not persisted.

routes = [
  { pattern = "aiartspell.art/api/agnes/*", zone_name = "aiartspell.art" },
  { pattern = "www.aiartspell.art/api/agnes/*", zone_name = "aiartspell.art" }
]

[vars]
AGNES_API_BASE_URL = "https://apihub.agnes-ai.com/v1"
# Fixed-IP reverse proxy (Tencent server, nginx:80 -> 127.0.0.1:8787).
# Tried first by the worker; apihub direct stays as automatic fallback.
# Uses the api subdomain over port 80: bare-IP fetches from Workers get 403,
# and the origin has no TLS listener yet (https -> 522).
AGNES_PROXY_URL = "http://api.aiartspell.art"
AGNES_IMAGE_MODEL = "agnes-image-2.5-flash"
AGNES_REQUEST_TIMEOUT_MS = "90000"
ALLOWED_ORIGINS = "https://aiartspell.art,https://www.aiartspell.art,http://localhost:4321,http://127.0.0.1:4321"
